   if(k=="work"&&ok(p.media_url)){const i=new Image();i.src=p.media_url;i.className="w";i.loading="lazy";i.alt=pick(p,"title");d.append(i);}return d;}):[empty()]));});
 const ph=D.posts.filter(p=>p.kind=="photo"&&ok(p.media_url)),sh=showAll?ph:ph.slice(0,8);
 $("c-photo").replaceChildren(...sh.map(p=>{const i=new Image();i.src=p.media_url;i.alt=pick(p,"title");i.loading="lazy";
  i.onclick=()=>{const z=el("div","zoom"),b=new Image();b.src=p.media_url;z.append(b);z.onclick=()=>z.remove();document.body.append(z);};return i;}));
 $("more").hidden=showAll||ph.length<=8;
 const vd=D.posts.filter(p=>p.kind=="video");
 $("c-video").replaceChildren(...vd.map(p=>{const d=el("div","card");d.append(el("b",null,pick(p,"title")));
  if(ok(p.media_url)){const a=el("a",null," "+t("watch"));a.href=p.media_url;a.target="_blank";a.rel="noopener";d.append(a);}return d;}));
 if(!ph.length&&!vd.length)$("c-photo").replaceChildren(empty());
 const items=[],addr=S["address_"+lang]||S.address_hi||S.address_en;if(addr)items.push(el("div","card pre",addr));
 const row=el("p"),btn=(txt,href,cls)=>{const a=el("a","btn "+(cls||""),txt);a.href=href;if(href.startsWith("https"))a.target="_blank";a.rel="noopener";row.append(a," ");};
 if(S.phone)btn(t("call")+" "+S.phone,"tel:"+S.phone);
 if(S.whatsapp)btn("WhatsApp","https://wa.me/"+(S.whatsapp.length==10?"91":"")+S.whatsapp,"alt");
 if(S.email)btn(t("mail"),"mailto:"+S.email);
 if(ok(S.maps_url))btn(t("map"),S.maps_url,"alt");
 if(ok(S.facebook))btn("Facebook",S.facebook);
 if(ok(S.youtube))btn("YouTube",S.youtube,"alt");
 if(row.children.length)items.push(row);$("c-contact").replaceChildren(...(items.length?items:[empty()]));}
async function load(){const r=await api("/api/data");if(r.ok)D=r.d;draw();if(!$("apanel").hidden)renderAdmin();}

$("f").onsubmit=async e=>{e.preventDefault();$("err").textContent="";
 const b={};["name","mobile","category","location","description"].forEach(k=>b[k]=$(k).value);
 const r=await api("/api/complaints","POST",b);
 if(!r.ok){$("err").textContent=t("e_"+(r.d.error||"server"))||t("e_server");return;}
 const ok=el("div","ok",t("done"));ok.append(el("br"),el("big",null,r.d.complaint_no),el("br"),el("small",null,t("keep")));$("res").replaceChildren(ok);$("f").reset();};
$("tf").onsubmit=async e=>{e.preventDefault();const o=$("tres");o.replaceChildren();
 const r=await api("/api/track?no="+encodeURIComponent($("no").value)+"&mobile="+encodeURIComponent($("tm").value));
 if(!r.ok){o.append(el("div","err",r.status==404?t("nf"):t("e_server")));return;}
 const c=el("div","card");c.append(el("b",null,r.d.complaint_no),el("br"),el("span","st "+r.d.status.split(" ")[0],t(r.d.status)));
 if(r.d.remarks)c.append(el("p",null,t("remarks")+": "+r.d.remarks));o.append(c);};

/* ---- Admin ---- */
const SF=[["photo_url","प्रोफाइल फोटो लिंक (https)"],["about_hi","परिचय (हिंदी)",1],["about_en","About (English)",1],["panchayat_hi","ग्राम पंचायत (हिंदी)",1],["panchayat_en","Gram Panchayat (English)",1],["sbm_hi","स्वच्छ भारत मिशन (हिंदी)",1],["sbm_en","Swachh Bharat Mission (English)",1],["phone","फोन नंबर"],["whatsapp","WhatsApp नंबर"],["email","ईमेल"],["address_hi","पता (हिंदी)",1],["address_en","Address (English)",1],["maps_url","Google Maps लिंक (https)"],["facebook","Facebook लिंक (https)"],["youtube","YouTube लिंक (https)"]];
const sf=$("sf");SF.forEach(([k,l,big])=>{const lb=el("label",null,l);lb.htmlFor="s_"+k;const i=document.createElement(big?"textarea":"input");i.id="s_"+k;if(big)i.rows=3;sf.append(lb,i);});
sf.append(el("div","err"),el("p"));sf.children[sf.children.length-2].id="serr";sf.lastChild.innerHTML='<button class="btn">सेव</button>';
function showAdmin(on){$("alogin").hidden=on;$("apanel").hidden=!on;if(on)loadAdmin();}
async function loadAdmin(){const c=await api("/api/admin/complaints");if(c.status==401){showAdmin(false);return;}AC=c.d||[];renderAdmin();
 SF.forEach(([k])=>$("s_"+k).value=D.settings[k]||"");}
function renderAdmin(){
 const n=s=>AC.filter(c=>c.status==s).length;
 $("astats").replaceChildren(...[["tot",AC.length],["pen",n("Pending")],["res",n("Resolved")]].map(([l,v])=>{const d=el("div","card");d.append(el("div","n",v),el("div","mu",t(l)));return d;}));
 $("alist").replaceChildren(...AC.map(c=>{const d=el("div","card");d.append(el("b",null,c.complaint_no));
  d.append(el("div","mu",c.name+" · "+c.mobile+" · "+t(c.category)+" · "+c.location),el("p",null,c.description));
  const row=el("div","row"),sel=document.createElement("select");
  ["Pending","In Progress","Resolved","Rejected"].forEach(x=>{const o=el("option",null,t(x));o.value=x;o.selected=x==c.status;sel.append(o);});
  const rem=document.createElement("input");rem.value=c.remarks||"";rem.maxLength=500;rem.placeholder=t("remarks");
  const sv=el("button","btn alt",t("save"));sv.onclick=async()=>{const r=await api("/api/admin/complaints/"+c.complaint_no,"PATCH",{status:sel.value,remarks:rem.value});if(r.ok)loadAdmin();};
  const dl=el("button","btn del",t("del"));dl.onclick=async()=>{if(confirm(t("sure"))){await api("/api/admin/complaints/"+c.complaint_no,"DELETE");loadAdmin();}};
  row.append(sel,rem,sv,dl);d.append(row);return d;}));
 $("aposts").replaceChildren(...D.posts.map(p=>{const d=el("div","card");d.append(el("b",null,p.kind+" · "+(p.title_hi||p.title_en)));
  const dl=el("button","btn del",t("del"));dl.style.marginTop="8px";dl.onclick=async()=>{if(confirm(t("sure"))){await api("/api/admin/posts/"+p.id,"DELETE");load();}};d.append(el("br"),dl);return d;}));}
$("alogin").onsubmit=async e=>{e.preventDefault();$("aerr").textContent="";
 const r=await api("/api/admin/login","POST",{password:$("apw").value});
 if(r.ok){$("apw").value="";showAdmin(true);}else $("aerr").textContent=r.status==401?"Wrong password":t("e_server");};
async function alogout(){await api("/api/admin/logout","POST");showAdmin(false);}
$("pf").onsubmit=async e=>{e.preventDefault();$("perr").textContent="";
 const r=await api("/api/admin/posts","POST",{kind:$("pk").value,title_hi:$("pth").value,title_en:$("pte").value,body_hi:$("pbh").value,body_en:$("pbe").value,media_url:$("pm").value});
 if(r.ok){$("pf").reset();load();}else $("perr").textContent="शीर्षक लिखें। फोटो/वीडियो के लिए https:// लिंक ज़रूरी / Title needed; photo/video needs https link";};
sf.onsubmit=async e=>{e.preventDefault();$("serr").textContent="";const b={};SF.forEach(([k])=>b[k]=$("s_"+k).value);
 const r=await api("/api/admin/settings","PUT",b);if(r.ok)load();else $("serr").textContent="गलत जानकारी: "+(r.d.field||"");};
api("/api/admin/me").then(r=>showAdmin(r.ok));
apply();load();
</script></body></html>
